[snapshot-machine-dev]
image="registry.fedoraproject.org/fedora-toolbox:45"
additional_packages="webkit2gtk4.1 gtk3 dejavu-sans-fonts libcanberra-gtk3 PackageKit-gtk3-module btrbk btrfs-progs"
init_hooks="curl -fsSL https://github.com/denoland/deno/releases/download/v2.9.8/deno-x86_64-unknown-linux-gnu.zip -o /tmp/deno.zip && sudo unzip -oq /tmp/deno.zip -d /usr/local/bin && sudo chmod 0755 /usr/local/bin/deno && rm -f /tmp/deno.zip"

